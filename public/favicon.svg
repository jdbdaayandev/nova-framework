<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3776AB" /> <!-- Python Blue -->
      <stop offset="100%" stop-color="#FFD43B" /> <!-- Python Yellow -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Nova Sparkle -->
  <path d="M 256 40 Q 256 256 472 256 Q 256 256 256 472 Q 256 256 40 256 Q 256 256 256 40 Z" 
        fill="url(#novaGrad)" filter="url(#glow)"/>
        
  <!-- Inner White Core for Depth -->
  <path d="M 256 120 Q 256 256 392 256 Q 256 256 256 392 Q 256 256 120 256 Q 256 256 256 120 Z" 
        fill="#FFFFFF" opacity="0.9"/>
</svg>
