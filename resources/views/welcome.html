<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Nova</title>
    
    <!-- Nova Favicon routed through the asset helper -->
    <link rel="icon" type="image/svg+xml" href="{{ asset('favicon.svg') }}">
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #3776AB; /* Adjusted to match Python/Nova Blue */
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .badge {
            background-color: #e0e7ff;
            color: var(--accent);
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1.5rem;
            line-height: 1;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .logo-container {
            margin-bottom: 1.5rem;
        }

        .logo-container img {
            height: 90px;
            width: auto;
        }

        p {
            font-size: 1.15rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
        }

        .links {
            display: flex;
            gap: 2rem;
            justify-content: center;
        }

        .links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .links a:hover {
            color: var(--accent);
        }

        footer {
            margin-top: 4rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        
        code {
            background: var(--border);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dynamic replacement via your regex engine -->
        <div class="badge">{{ framework_version }}</div>
        
        <!-- Nova Main Logo routed through the asset helper -->
        <div class="logo-container">
            <img src="{{ asset('logo.svg') }}" alt="Nova Framework Logo">
        </div>

        <p>A lightweight, elegant Python web framework built on micro-component architecture, clean request lifecycles, and rapid developer agility.</p>
        
        <div class="links">
            <a href="https://github.com" target="_blank">Documentation</a>
            <a href="#" onclick="alert('Nova CLI tools are up and running!')">CLI Status</a>
            <a href="https://github.com" target="_blank">GitHub</a>
        </div>

        <footer>
            Environment: <code>{{ env }}</code> &nbsp;|&nbsp; Python: <code>{{ python_version }}</code>
        </footer>
    </div>
</body>
</html>
